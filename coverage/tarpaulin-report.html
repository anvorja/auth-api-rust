exiones a PostgreSQL\n///\n/// Configuración\n/// - Usa las settings de la aplicación\n/// - Configura timeouts y límites de conexiones\n/// - Verifica la conexión antes de retornar\npub async fn create_pool(settings: \u0026Settings) -\u003e Result\u003cDbPool, AppError\u003e {\n    tracing::info!(\n        \"Creando pool de conexiones a PostgreSQL (max: {}, min: {})\",\n        settings.database.max_connections,\n        settings.database.min_connections\n    );\n\n    let pool = PgPoolOptions::new()\n        .max_connections(settings.database.max_connections)\n        .min_connections(settings.database.min_connections)\n        .acquire_timeout(Duration::from_secs(settings.database.acquire_timeout))\n        // Tiempo máximo que una conexión puede estar idle\n        .idle_timeout(Duration::from_secs(600)) // 10 minutos\n        // Tiempo máximo de vida de una conexión\n        .max_lifetime(Duration::from_secs(1800)) // 30 minutos\n        // Test de conexión antes de usar (opcional, pero bueno para producción)\n        .test_before_acquire(true)\n        .connect(\u0026settings.database.url)\n        .await\n        .map_err(|e| {\n            tracing::error!(\"Error al conectar con PostgreSQL: {}\", e);\n            // Clasificar el error apropiadamente\n            match e {\n                sqlx::Error::PoolTimedOut =\u003e {\n                    tracing::error!(\"Timeout del pool - base de datos no responde\");\n                    AppError::unavailable()  // ✓ 503 Service Unavailable\n                }\n                sqlx::Error::PoolClosed =\u003e {\n                    tracing::error!(\"Pool cerrado - posible reinicio de base de datos\");\n                    AppError::unavailable()  // ✓ 503 Service Unavailable\n                }\n                sqlx::Error::Configuration(_) =\u003e {\n                    // Error de configuración de la base de datos\n                    tracing::error!(\"Configuración de DB inválida\");\n                    AppError::config(format!(\"URL de base de datos inválida: {}\", e))  // ✓ ConfigError\n                }\n                sqlx::Error::Database(db_err) =\u003e {\n                    if db_err.is_unique_violation() {\n                        // Esto no debería pasar al conectar, pero por si acaso\n                        AppError::config(\"Configuración de DB duplicada o conflictiva\".to_string())\n                    } else {\n                        AppError::DatabaseConnectionError\n                    }\n                }\n                // Otros errores de conexión (network, auth, etc.)\n                _ =\u003e AppError::DatabaseConnectionError,  // 500 Internal Server Error\n            }\n        })?;\n\n    tracing::info!(\"✓ Pool de conexiones creado exitosamente\");\n\n    // Verificar conexión ejecutando una query simple\n    verify_connection(\u0026pool).await?;\n\n    Ok(pool)\n}\n\n/// Verifica que la conexión a la base de datos funcione\npub async fn verify_connection(pool: \u0026DbPool) -\u003e Result\u003c(), AppError\u003e {\n    tracing::debug!(\"Verificando conexión a la base de datos...\");\n\n    sqlx::query(\"SELECT 1\")\n        .execute(pool)\n        .await\n        .map_err(|e| {\n            tracing::error!(\"Error al verificar conexión: {}\", e);\n            AppError::DatabaseConnectionError\n        })?;\n\n    tracing::debug!(\"✓ Conexión verificada\");\n    Ok(())\n}\n\n/// Health check de la base de datos\n/// Retorna true si la DB está disponible, false en caso contrario\npub async fn health_check(pool: \u0026DbPool) -\u003e bool {\n    match sqlx::query(\"SELECT 1\").execute(pool).await {\n        Ok(_) =\u003e {\n            tracing::debug!(\"Health check DB: OK\");\n            true\n        }\n        Err(e) =\u003e {\n            tracing::warn!(\"Health check DB: FAIL - {}\", e);\n            false\n        }\n    }\n}\n\n/// Cierra el pool de conexiones de manera ordenada\npub async fn close_pool(pool: DbPool) {\n    tracing::info!(\"Cerrando pool de conexiones...\");\n    pool.close().await;\n    tracing::info!(\"✓ Pool cerrado\");\n}\n\n/// Obtiene estadísticas del pool de conexiones\npub fn pool_stats(pool: \u0026DbPool) -\u003e PoolStats {\n    PoolStats {\n        size: pool.size(),\n        idle: pool.num_idle(),\n    }\n}\n\n/// Estadísticas del pool de conexiones\n#[derive(Debug, Clone)]\npub struct PoolStats {\n    /// Número total de conexiones en el pool\n    pub size: u32,\n    /// Número de conexiones idle (disponibles)\n    pub idle: usize,\n}\n\nimpl PoolStats {\n    /// Número de conexiones activas (en uso)\n    pub fn active(\u0026self) -\u003e u32 {\n        self.size.saturating_sub(self.idle as u32)\n    }\n}","traces":[{"line":17,"address":[13613888,13613896],"length":1,"stats":{"Line":8}},{"line":18,"address":[15247567,15247713,15248108],"length":1,"stats":{"Line":4}},{"line":24,"address":[15251757,15249894,15250268,15249354,15249816,15249484,15249614,15248079,15250437,15250370],"length":1,"stats":{"Line":19}},{"line":25,"address":[15249192],"length":1,"stats":{"Line":2}},{"line":26,"address":[15249230],"length":1,"stats":{"Line":1}},{"line":27,"address":[15249149,15250049,15249378,15249298,15249272],"length":1,"stats":{"Line":6}},{"line":29,"address":[15249428,15250020,15249406,15249508],"length":1,"stats":{"Line":2}},{"line":31,"address":[15249536,15249638,15249558,15249988],"length":1,"stats":{"Line":6}},{"line":34,"address":[15249824,15249950,15249681,15249759,15249732],"length":1,"stats":{"Line":2}},{"line":35,"address":[13360545],"length":1,"stats":{"Line":12}},{"line":36,"address":[15252864,15250347,15256103,15258429],"length":1,"stats":{"Line":4}},{"line":37,"address":[15252895,15253032,15253463],"length":1,"stats":{"Line":0}},{"line":39,"address":[15253390],"length":1,"stats":{"Line":0}},{"line":41,"address":[15254507,15256116,15256484],"length":1,"stats":{"Line":0}},{"line":42,"address":[15256474,15257282],"length":1,"stats":{"Line":0}},{"line":45,"address":[152 e, AppError\u003e\nwhere\n    R: UserRepository + 'static,\n    P: PasswordHasher + 'static,\n    J: JwtService + 'static,\n    S: AsRef\u003cArc\u003cAuthUseCase\u003cR, P, J\u003e\u003e\u003e + AsRef\u003cArc\u003cJ\u003e\u003e + Clone + Send + Sync + 'static,\n{\n    // Validar el request\n    request.validate()?;\n\n    // Obtener servicios del state\n    let auth_usecase: \u0026Arc\u003cAuthUseCase\u003cR, P, J\u003e\u003e = state.as_ref();\n    let jwt_service: \u0026Arc\u003cJ\u003e = state.as_ref();\n\n    // Ejecutar caso de uso\n    let (user, access_token, refresh_token) = auth_usecase.register_user(request).await?;\n\n    // Crear respuesta (SOLO JSON, sin cookies)\n    let response = AuthResponse::new(\n        access_token,\n        refresh_token,\n        jwt_service.get_access_token_expiry(),\n        \u0026user,\n    );\n\n    Ok((StatusCode::CREATED, Json(response)))\n}\n\n/// Handler para login de usuario\n///\n/// POST /api/v1/auth/login\n///\n/// Retorna tokens JWT en el body (NO en cookies)\n#[utoipa::path(\n    post,\n    path = \"/api/v1/auth/login\",\n    request_body = LoginRequest,\n    responses(\n        (status = 200, description = \"Login exitoso\", body = AuthResponse),\n        (status = 400, description = \"Validación fallida\"),\n        (status = 401, description = \"Credenciales inválidas\")\n    ),\n    tag = \"Authentication\"\n)]\npub async fn login_handler\u003cR, P, J, S\u003e(\n    State(state): State\u003cS\u003e,\n    Json(request): Json\u003cLoginRequest\u003e,\n) -\u003e Result\u003cimpl IntoResponse, AppError\u003e\nwhere\n    R: UserRepository + 'static,\n    P: PasswordHasher + 'static,\n    J: JwtService + 'static,\n    S: AsRef\u003cArc\u003cAuthUseCase\u003cR, P, J\u003e\u003e\u003e + AsRef\u003cArc\u003cJ\u003e\u003e + Clone + Send + Sync + 'static,\n{\n    // Validar el request\n    request.validate()?;\n\n    // Obtener servicios del state\n    let auth_usecase: \u0026Arc\u003cAuthUseCase\u003cR, P, J\u003e\u003e = state.as_ref();\n    let jwt_service: \u0026Arc\u003cJ\u003e = state.as_ref();\n\n    // Ejecutar caso de uso\n    let (user, access_token, refresh_token) = auth_usecase.login_user(request).await?;\n\n    // Crear respuesta (SOLO JSON, sin cookies)\n    let response = AuthResponse::new(\n        access_token,\n        refresh_token,\n        jwt_service.get_access_token_expiry(),\n        \u0026user,\n    );\n\n    Ok((StatusCode::OK, Json(response)))\n}\n\n/// Handler para refresh token\n///\n/// POST /api/v1/auth/refresh\n///\n/// Renueva los tokens JWT usando un refresh token válido\n#[utoipa::path(\n    post,\n    path = \"/api/v1/auth/refresh\",\n    request_body = RefreshRequest,\n    responses(\n        (status = 200, description = \"Tokens renovados\", body = AuthResponse),\n        (status = 400, description = \"Validación fallida\"),\n        (status = 401, description = \"Refresh token inválido\")\n    ),\n    tag = \"Authentication\"\n)]\npub async fn refresh_handler\u003cR, P, J, S\u003e(\n    State(state): State\u003cS\u003e,\n    Json(request): Json\u003cRefreshRequest\u003e,\n) -\u003e Result\u003cimpl IntoResponse, AppError\u003e\nwhere\n    R: UserRepository + 'static,\n    P: PasswordHasher + 'static,\n    J: JwtService + 'static,\n    S: AsRef\u003cArc\u003cAuthUseCase\u003cR, P, J\u003e\u003e\u003e + AsRef\u003cArc\u003cJ\u003e\u003e + Clone + Send + Sync + 'static,\n{\n    // Validar el request\n    request.validate()?;\n\n    // Obtener servicios del state\n    let auth_usecase: \u0026Arc\u003cAuthUseCase\u003cR, P, J\u003e\u003e = state.as_ref();\n    let jwt_service: \u0026Arc\u003cJ\u003e = state.as_ref();\n\n    // Ejecutar caso de uso\n    let (user, access_token, refresh_token) = auth_usecase\n        .refresh_token(\u0026request.refresh_token)\n        .await?;\n\n    // Crear respuesta (SOLO JSON, sin cookies)\n    let response = AuthResponse::new(\n        access_token,\n        refresh_token,\n        jwt_service.get_access_token_expiry(),\n        \u0026user,\n    );\n\n    Ok((StatusCode::OK, Json(response)))\n}\n\n/// Handler para logout\n///\n/// POST /api/v1/auth/logout\n///\n/// En arquitectura stateless con Bearer tokens, el logout es client-side\n/// (el cliente simplemente elimina los tokens)\n#[utoipa::path(\n    post,\n    path = \"/api/v1/auth/logout\",\n    responses(\n        (status = 200, description = \"Logout exitoso\", body = SuccessResponse)\n    ),\n    tag = \"Authentication\"\n)]\npub async fn logout_handler() -\u003e impl IntoResponse {\n    let response = SuccessResponse {\n        message: \"Logout exitoso. Elimina los tokens del lado del cliente.\".to_string(),\n    };\n\n    (StatusCode::OK, Json(response))\n}","traces":[{"line":32,"address":[15088896],"length":1,"stats":{"Line":0}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":50,"address":[13352692],"length":1,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[15090508],"length":1,"stats":{"Line":0}},{"line":56,"address":[],"length":0,"stats":{"Line":0}},{"line":57,"address":[],"length":0,"stats":{"Line":0}},{"line":60,"address":[],"length":0,"stats":{"Line":0}},{"line":79,"address":[15084560],"length":1,"stats":{"Line":0}},{"line":90,"address":[],"length":0,"stats":{"Line":0}},{"line":93,"address":[],"length":0,"stats":{"Line":0}},{"line":94,"address":[],"length":0,"stats":{"Line":0}},{"line":97,"address":[15085423,15084932,15085199,15086504],"length":1,"stats":{"Line":0}},{"line":101,"address":[],"length":0,"stats":{"Line":0}},{"line":102,"address":[],"length":0,"stats":{"Line":0}},{"line":103,"address":[],"length":0,"stats":{"Line":0}},{"line":104,"address":[],"length":0,"stats":{"Line":0}},{"line":107,"address":[],"length":0,"stats":{"Line":0}},{"line":126,"address":[15086976],"length":1,"stats":{"Line":0}},{"line":137,"address":[],"len ticado\")\n    ),\n    tag = \"Users\",\n    security(\n        (\"bearer_auth\" = [])\n    )\n)]\npub async fn get_profile_handler\u003cR, P, J, S\u003e(\n    Extension(AuthenticatedUser(user)): Extension\u003cAuthenticatedUser\u003e,\n) -\u003e Result\u003cimpl IntoResponse, AppError\u003e\nwhere\n    R: UserRepository + 'static,\n    P: PasswordHasher + 'static,\n    J: JwtService + 'static,\n    S: Clone + Send + Sync + 'static,\n{\n    // El usuario ya está autenticado gracias al middleware\n    let response = UserResponse::from_domain(\u0026user);\n\n    Ok((StatusCode::OK, Json(response)))\n}\n\n/// Handler para cambiar contraseña\n///\n/// POST /api/v1/users/change-password\n///\n/// Requiere autenticación (access token en cookies)\n#[utoipa::path(\n    post,\n    path = \"/api/v1/users/change-password\",\n    request_body = ChangePasswordRequest,\n    responses(\n        (status = 200, description = \"Contraseña cambiada exitosamente\", body = SuccessResponse),\n        (status = 400, description = \"Validación fallida\"),\n        (status = 401, description = \"No autenticado o contraseña actual incorrecta\")\n    ),\n    tag = \"Users\",\n    security(\n        (\"bearer_auth\" = [])\n    )\n)]\npub async fn change_password_handler\u003cR, P, J, S\u003e(\n    State(state): State\u003cS\u003e,\n    Extension(AuthenticatedUser(user)): Extension\u003cAuthenticatedUser\u003e,\n    Json(request): Json\u003cChangePasswordRequest\u003e,\n) -\u003e Result\u003cimpl IntoResponse, AppError\u003e\nwhere\n    R: UserRepository + 'static,\n    P: PasswordHasher + 'static,\n    J: JwtService + 'static,\n    S: AsRef\u003cArc\u003cAuthUseCase\u003cR, P, J\u003e\u003e\u003e + Clone + Send + Sync + 'static,\n{\n    // Validar el request\n    request.validate()?;\n\n    // Verificar que las contraseñas coincidan\n    if !request.passwords_match() {\n        return Err(AppError::ValidationError(\n            \"Las contraseñas no coinciden\".to_string(),\n        ));\n    }\ autenticado\n#[derive(Clone)]\npub struct AuthenticatedUser(pub User);\n\n/// Middleware de autenticación - Solo Bearer Token\n///\n/// Extrae el token del header: Authorization: Bearer \u003ctoken\u003e\npub async fn auth_middleware\u003cR, P, J\u003e(\n    State(auth_usecase): State\u003cArc\u003cAuthUseCase\u003cR, P, J\u003e\u003e\u003e,\n    mut request: Request,\n    next: Next,\n) -\u003e Result\u003cResponse, AppError\u003e\nwhere\n    R: UserRepository + 'static,\n    P: PasswordHasher + 'static,\n    J: JwtService + 'static,\n{\n    // Extraer token del header Authorization\n    let auth_header = request\n        .headers()\n        .get(header::AUTHORIZATION)\n        .ok_or_else(|| {\n            tracing::warn!(\"❌ Header Authorization no encontrado\");\n            AppError::Unauthorized\n        })?;\n\n    let auth_str = auth_header\n        .to_str()\n        .map_err(|_| {\n            tracing::warn!(\"❌ Header Authorization con formato inválido\");\n            AppError::Unauthorized\n        })?;\n\n    // Verificar formato \"Bearer \u003ctoken\u003e\"\n    let access_token = auth_str\n        .strip_prefix(\"Bearer \")\n        .ok_or_else(|| {\n            tracing::warn!(\"❌ Header Authorization sin prefijo 'Bearer '\");\n            AppError::Unauthorized\n        })?;\n\n    tracing::debug!(\"🔑 Token Bearer extraído correctamente\");\n\n    // Validar el token y obtener el usuario\n    let user = auth_usecase\n        .validate_access_token(access_token)\n        .await?;\n\n    // Añadir el usuario a las extensions del request\n    request.extensions_mut().insert(AuthenticatedUser(user));\n\n    // Continuar con el siguiente middleware/handler\n    Ok(next.run(request).await)\n}\n\n/// Extractor personalizado para obtener el usuario autenticado\nimpl\u003cS\u003e axum::extract::FromRequestParts\u003cS\u003e for AuthenticatedUser\nwhere\n    S: Send + Sync,\n{\n    type Rejection = (StatusCode, \u0026'static str);\n\n    async fn from_request_parts(\n        parts: \u0026mut axum::http::request::Parts,\n        _state: \u0026S,\n    ) -\u003e Result\u003cSelf, Self::Rejection\u003e {\n        parts\n            .extensions\n            .get::\u003cAuthenticatedUser\u003e()\n            .cloned()\n            .ok_or((\n                StatusCode::UNAUTHORIZED,\n                \"Usuario no autenticado. Debe incluir: Authorization: Bearer \u003ctoken\u003e\",\n            ))\n    }\n}","traces":[{"line":22,"address":[14434960],"length":1,"stats":{"Line":0}},{"line":33,"address":[14437507,14435548,14435615,14435452],"length":1,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":0}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"line":45,"address":[],"length":0,"stats":{"Line":0}},{"line":49,"address":[14437474,14435956,14436023],"length":1,"stats":{"Line":0}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":56,"address":[],"length":0,"stats":{"Line":0}},{"line":59,"address":[],"length":0,"stats":{"Line":0}},{"line":60,"address":[14437384],"length":1,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":64,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":81,"address":[],"length":0,"stats":{"Line":0}},{"line":82,"address":[],"length":0,"stats":{"Line":0}},{"line":85,"address":[],"length":0,"stats":{"Line":0}},{"line":86,"address":[],"length":0,"stats":{"Line":0}},{"line":87,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":25},{"path":["/","home","anborja","RustroverProjects","auth-api-rust","src","infrastructure","http","middleware","cors.rs"],"content":"// src/infrastructure/http/middleware/cors.rs\nuse tower_http::cors::CorsLayer;\nuse axum::http::{HeaderValue, Method};\nuse crate::config::{Settings, Environment};\n\n/// Crea CORS según el entorno\npub fn create_cors_layer(settings: \u0026Settings) -\u003e CorsLayer {\n    match settings.environment {\n        Environment::Development =\u003e create_development_cors(settings),\n        Environment::Test =\u003e create_test_cors(settings),\n        Environment::Production =\u003e create_production_cors(settings),\n    }\n}\n\n/// CORS para desarrollo (permisivo, localhost sin HTTPS)\nfn create_development_cors(settings: \u0026Settings) -\u003e CorsLayer {\n    tracing::info!(\"🔓 CORS: Desarrollo - Permisivo (HTTP localhost)\");\n\n    // La configuración viene de settings (de .env)\n    let allowed_origins: Vec\u003cHeaderValue\u003e = settings\n        .security\n        .allowed_origins\n        .iter()\n        .filter_map(|origin| {\n            origin.parse::\u003cHeaderValue\u003e().ok()\n        })\n        .collect();\n\n    if allowed_origins.is_empty() {\n        tracing::warn!(\"⚠️  No hay orígenes configurados en ALLOWED_ORIGINS\");\n    }\n\n    tracing::info!(\"   Orígenes permitidos: {:?}\",\n        settings.security.allowed_origins.iter().collect::\u003cVec\u003c_\u003e\u003e()\n    );\n\n    CorsLayer::new()\n        .allow_origin(allowed_origins)\n        .allow_methods([\n            Method::GET,\n            Method::POST,\n            Method::PUT,\n            Method::DELETE,\n            Method::PATCH,\n            Method::OPTIONS,\n        ])\n        .allow_headers([\n            axum::http::header::CONTENT_TYPE,\n            axum::http::header::AUTHORIZATION,\n            axum::http::header::ACCEPT,\n            axum::http::header::ORIGIN,\n        ])\n        .expose_headers([\n            axum::http::header::CONTENT_TYPE,\n        ])\n        .allow_credentials(false)\n        .max_age(std::time::Duration::from_secs(3600))\n}\n\n/// CORS para testing\nfn create_test_cors(settings: \u0026Settings) -\u003e CorsLayer {\n    tracing::info!(\"🧪 CORS: Testing - Configuración balanceada\");\n\n    let allowed_origins: Vec\u003cHeaderValue\u003e = settings\n        .security\n        .allowed_origins\n        .iter()\n        .filter_map(|origin| origin.parse().ok())\n        .collect();\n\n    CorsLayer::new()\n        .allow_origin(allowed_origins)\n        .allow_methods([\n            Method::GET,\n            Method::POST,\n            Method::PUT,\n            Method::DELETE,\n            Method::OPTIONS,\n        ])\n        .allow_headers([\n            axum::http::header::CONTENT_TYPE,\n            axum::http::header::AUTHORIZATION,\n            axum::http::header::ACCEPT,\n        ])\n        .expose_headers([\n            axum::http::header::CONTENT_TYPE,\n        ])\n        .allow_credentials(false)\n        .max_age(std::time::Duration::from_secs(1800))\n}\n\n/// CORS para producción (restrictivo, SOLO HTTPS)\nfn create_production_cors(settings: \u0026Settings) -\u003e CorsLayer {\n    tracing::info!(\"🔒 CORS: Producción - Máxima seguridad (HTTPS required)\");\n\n    // ✅ Validar que SOLO haya orígenes HTTPS en producción\n    let allowed_origins: Vec\u003cHeaderValue\u003e = settings\n        .security\n        .allowed_origins\n        .iter()\n        .filter(|origin| {\n            if !origin.starts_with(\"https://\") {\n                tracing::error!(\"❌ Origen NO HTTPS rechazado en producción: {}\", origin);\n                false\n            } else {\n                true\n            }\n        })\n        .filter_map(|origin| origin.parse().ok())\n        .collect();\n\n    if allowed_origins.is_empty() {\n        tracing::error!(\"❌ PRODUCCIÓN: No hay orígenes HTTPS configurados!\");\n        panic!(\"CORS en producción requiere al menos un origen HTTPS en ALLOWED_ORIGINS\");\n    }\n\n    tracing::info!(\"   Orígenes HTTPS permitidos: {:?}\",\n        settings.security.allowed_origins\n            .iter()\n            .filter(|o| o.starts_with(\"https://\"))\n            .collect::\u003cVec\u003c_\u003e\u003e()\n    );\n\n    CorsLayer::new()\n        .allow_origin(allowed_origins)\n        .allow_methods([\n            Method::GET,\n            Method::POST,\n            Method::PUT,\n            Method::DELETE,\n            Method::OPTIONS,\n        ])\n        .allow_headers([\n            axum::http::header::CONTENT_TYPE,\n            axum::http::header::AUTHORIZATION,\n            axum::http::header::ACCEPT,\n        ])\n        .expose_headers([\n            axum::http::header::CONTENT_TYPE,\n        ])\n        .allow_credentials(false)\n        .max_age(std::time::Duration::from_secs(3600))\n}","traces":[{"line":7,"address":[14344576],"length":1,"stats":{"Line":1}},{"line":8,"address":[14344599],"length":1,"stats":{"Line":1}},{"line":9,"address":[14344644],"length":1,"stats":{"Line":0}},{"line":10,"address":[14344676],"length":1,"stats":{"Line":1}},{"line":11,"address":[14344660],"length":1,"stats":{"Line":0}},{"line":16,"address":[14352712,14349280,14353744],"length":1,"stats":{"Line":0}},{"line":17,"address":[14349852,14349319],"length":1,"stats":{"Line":0}},{"line":20,"address":[14349798,14349756],"length":1,"stats":{"Line":0}},{"line":24,"address":[14349790],"length":1,"stats":{"Line":0}},{"line":25,"address":[14192757],"length":1,"stats":{"Line":0}},{"line":29,"address":[14349835,14350310],"length":1,"stats":{"Line":0}},{"line":30,"address":[14350347],"length":1,"stats":{"Line":0}},{"line":33,"address":[14352746,14352371],"length":1,"stats":{"Line":0}},{"line":37,"address":[14351894,14353667],"length":1,"stats":{"Line":0}},{"line":38,"address":[14353094],"length":1,"stats":{"Line":0}},{"line":39,"address":[14353165],"length":1,"stats":{"Line":0}},{"line":47,"address":[14353354],"length":1,"stats":{"Line":0}},{"line":53,"address":[14353494],"length":1,"stats" ,\n        security: SecuritySettings {\n            allowed_origins: vec![\"http://localhost:3000\".to_string()],\n        },\n        environment: Environment::Test,\n    };\n\n    let _cors = create_cors_layer(\u0026settings);\n\n    // Si no panic, el layer se creó correctamente\n}","traces":[],"covered":0,"coverable":0},{"path":["/","home","anborja","RustroverProjects","auth-api-rust","src","infrastructure","http","middleware","test","mod.rs"],"content":"// src/infrastructure/http/middleware/test/mod.rs\nmod auth_test;\nmod cors_test;\nmod security_headers_test;\nmod test_helpers;","traces":[],"covered":0,"coverable":0},{"path":["/","home","anborja","RustroverProjects","auth-api-rust","src","infrastructure","http","middleware","test","security_headers_test.rs"],"content":"// src/infrastructure/http/middleware/test/security_headers_test.rs\nuse super::test_helpers::{apply_test_security_headers, SecurityHeadersTestConfig};\nuse axum::{\n    body::Body,\n    http::{Request, Response, StatusCode},\n    middleware::{self, Next},\n    Router,\n};\nuse tower::Service;\nuse std::pin::Pin;\nuse std::future::Future;\n\n#[test]\nfn test_security_headers_middleware_exists() {\n    use crate::infrastructure::http::middleware::security_headers_middleware;\n    let _middleware = security_headers_middleware;\n}\n\n#[test]\nfn test_environment_detection_logic() {\n    let test_cases = vec![\n        (\"production\", true),\n        (\"Production\", true),\n        (\"PRODUCTION\", true),\n        (\"development\", false),\n        (\"Development\", false),\n        (\"test\", false),\n        (\"\", false),\n    ];\n\n    for (env_value, expected_is_production) in test_cases {\n        let is_production = env_value.to_lowercase() == \"production\";\n        assert_eq!(\n            is_production, expected_is_production,\n            \"Failed for env value: '{}'\",\n            env_value\n        );\n    }\n}\n\n// ============================================================================\n// TESTS DE INTEGRACIÓN\n// ============================================================================\n\nasync fn dummy_handler() -\u003e \u0026'static str {\n    \"OK\"\n}\n\n/// Factory function para crear app de test con configuración\nasync fn create_test_app(config: SecurityHeadersTestConfig) -\u003e Router {\n    let middleware_fn = move |req: Request \u003cBody\u003e, next: Next| {\n        let cfg = SecurityHeadersTestConfig {\n            is_production: config.is_production,\n        };\n        Box::pin(async move { apply_test_security_headers(req, next, cfg).await })\n            as Pin\u003cBox\u003cdyn Future\u003cOutput = Response\u003cBody\u003e\u003e + Send\u003e\u003e\n    };\n\n    Router::new()\n        .route(\"/test\", axum::routing::get(dummy_handler))\n        .layer(middleware::from_fn(middleware_fn))\n}\n\nasync fn test_with_config(config: SecurityHeadersTestConfig) -\u003e Response\u003cBody\u003e {\n    let mut app = create_test_app(config).await;\n\n    let request = Request::builder()\n        .uri(\"/test\")\n        .body(Body::empty())\n        .unwrap();\n\n    app.call(request).await.unwrap()\n}\n\n#[tokio::test]\nasync fn test_security_headers_in_development() {\n    let response = test_with_config(SecurityHeadersTestConfig::development()).await;\n\n    assert_eq!(response.status(), StatusCode::OK);\n\n    let headers = response.headers();\n    assert!(headers.contains_key(\"x-frame-options\"));\n    assert!(headers.contains_key(\"x-content-type-options\"));\n    assert!(headers.contains_key(\"content-security-policy\"));\n\n    let csp = headers\n        .get(\"content-security-policy\")\n        .unwrap()\n        .to_str()\n        .unwrap();\n\n    assert!(csp.contains(\"connect-src 'self' http://localhost:*\"));\n    assert!(csp.contains(\"'unsafe-inline'\"));\n    assert!(!headers.contains_key(\"strict-transport-security\"));\n}\n\n#[tokio::test]\nasync fn test_security_headers_in_production() {\n    let response = test_with_config(SecurityHeadersTestConfig::production()).await;\n\n    assert_eq!(response.status(), StatusCode::OK);\n\n    let headers = response.headers();\n    let csp = headers\n        .get(\"content-security-policy\")\n        .unwrap()\n        .to_str()\n        .unwrap();\n\n    assert!(csp.contains(\"connect-src 'self'\") \u0026\u0026 !csp.contains(\"http://localhost\"));\n    assert!(!csp.contains(\"'unsafe-inline'\"));\n    assert!(headers.contains_key(\"strict-transport-security\"));\n    assert!(headers.contains_key(\"x-xss-protection\"));\n    assert!(headers.contains_key(\"permissions-policy\"));\n}\n\n#[tokio::test]\nasync fn test_x_frame_options_always_deny() {\n    let response = test_with_config(SecurityHeadersTestConfig::development()).await;\n    let headers = response.headers();\n    let x_frame = headers.get(\"x-frame-options\").unwrap().to_str().unwrap();\n    assert_eq!(x_frame, \"DENY\");\n}\n\n#[tokio::test]\nasync fn test_x_content_type_options_always_nosniff() {\n    let response = test_with_config(SecurityHeadersTestConfig::development()).await;\n    let headers = response.headers();\n    let x_content = headers\n        .get(\"x-content-type-options\")\n        .unwrap()\n        .to_str()\n        .unwrap();\n    assert_eq!(x_content, \"nosniff\");\n}\n\n#[tokio::test]\nasync fn test_referrer_policy_always_set() {\n    let response = test_with_config(SecurityHeadersTestConfig::development()).await;\n    let headers = response.headers();\n    assert!(headers.contains_key(\"referrer-policy\"));\n    let referrer = headers.get(\"referrer-policy\").unwrap().to_str().unwrap();\n    assert_eq!(referrer, \"strict-origin-when-cross-origin\");\n}","traces":[{"line":45,"address":[13873740,13873680,13873698],"length":1,"stats":{"Line":7}},{"line":50,"address":[13873760,13874235,13874206,13873788,13874263,13873870],"length":1,"stats":{"Line":19}},{"line":51,"address":[13873851,13874304],"length":1,"stats":{"Line":10}},{"line":53,"addres  replica la lógica de security_headers_middleware,\n/// pero acepta configuración explícita en lugar de leer de env vars.\npub async fn apply_test_security_headers(\n    request: Request,\n    next: Next,\n    config: SecurityHeadersTestConfig,\n) -\u003e Response\u003cBody\u003e {\n    let mut response = next.run(request).await;\n    let headers = response.headers_mut();\n\n    // Headers básicos (siempre)\n    headers.insert(\n        header::X_FRAME_OPTIONS,\n        \"DENY\".parse().unwrap(),\n    );\n    headers.insert(\n        header::X_CONTENT_TYPE_OPTIONS,\n        \"nosniff\".parse().unwrap(),\n    );\n    headers.insert(\n        header::REFERRER_POLICY,\n        \"strict-origin-when-cross-origin\".parse().unwrap(),\n    );\n\n    // CSP según configuración\n    if config.is_production {\n        // 🔐 Producción: CSP restrictivo\n        headers.insert(\n            header::CONTENT_SECURITY_POLICY,\n            \"default-src 'self'; \\\n             script-src 'self'; \\\n             style-src 'self'; \\\n             img-src 'self' data: https:; \\\n             font-src 'self' data:; \\\n             connect-src 'self'; \\\n             frame-ancestors 'none'; \\\n             base-uri 'self'; \\\n             form-action 'self'\"\n                .parse()\n                .unwrap(),\n        );\n\n        // Headers adicionales de producción\n        headers.insert(\n            header::STRICT_TRANSPORT_SECURITY,\n            \"max-age=31536000; includeSubDomains; preload\".parse().unwrap(),\n        );\n        headers.insert(\n            axum::http::HeaderName::from_static(\"x-xss-protection\"),\n            \"1; mode=block\".parse().unwrap(),\n        );\n        headers.insert(\n            axum::http::HeaderName::from_static(\"permissions-policy\"),\n            \"geolocation=(), microphone=(), camera=(), payment=()\".parse().unwrap(),\n        );\n    } else {\n        // 🔓 Desarrollo: CSP permisivo\n        headers.insert(\n            header::CONTENT_SECURITY_POLICY,\n            \"default-src 'self'; \\\n             script-src 'self' 'unsafe-inline' 'unsafe-eval'; \\\n             style-src 'self' 'unsafe-inline'; \\\n             img-src 'self' data: https:; \\\n             font-src 'self' data:; \\\n             connect-src 'self' http://localhost:* http://127.0.0.1:*; \\\n             frame-ancestors 'none'; \\\n             base-uri 'self'; \\\n             form-action 'self'\"\n                .parse()\n                .unwrap(),\n        );\n    }\n\n    response\n}","traces":[{"line":45,"address":[14882480],"length":1,"stats":{"Line":2}},{"line":50,"address":[14448295,14448365,14448249,14448457],"length":1,"stats":{"Line":5}},{"line":51,"address":[14448936,14448865],"length":1,"stats":{"Line":5}},{"line":54,"address":[14449092],"length":1,"stats":{"Line":3}},{"line":55,"address":[14448944],"length":1,"stats":{"Line":2}},{"line":56,"address":[14449054,14448982],"length":1,"stats":{"Line":5}},{"line":58,"address":[14449310],"length":1,"stats":{"Line":3}},{"line":59,"address":[14449162],"length":1,"stats":{"Line":2}},{"line":60,"address":[14449200,14449272],"length":1,"stats":{"Line":5}},{"line":62,"address":[14449528],"length":1,"stats":{"Line":3}},{"line":63,"address":[14449380],"length":1,"stats":{"Line":2}},{"line":64,"address":[14449418,14449490],"length":1,"stats":{"Line":5}},{"line":68,"address":[14449603],"length":1,"stats":{"Line":2}},{"line":70,"address":[14450093],"length":1,"stats":{"Line":1}},{"line":71,"address":[14449681],"length":1,"stats":{"Line":1}},{"line":81,"address":[14449719],"length":1,"stats":{"Line":1}},{"line":82,"address":[14450055],"length":1,"stats":{"Line":1}},{"line":86,"address":[14450311],"length":1,"stats":{"Line":1}},{"line":87,"address":[14450163],"length":1,"stats":{"Line":1}},{"line":88,"address":[14450273,14450201],"length":1,"stats":{"Line":2}},{"line":90,"address":[14450565],"length":1,"stats":{"Line":1}},{"line":91,"address":[14450381],"length":1,"stats" sswordHasher + Clone,\n    J: JwtService + Clone,\n{\n    pub pool: DbPool,\n    pub auth_usecase: Arc\u003cAuthUseCase\u003cR, P, J\u003e\u003e,\n    pub jwt_service: Arc\u003cJ\u003e,\n}\n\nimpl\u003cR, P, J\u003e AppState\u003cR, P, J\u003e\nwhere\n    R: UserRepository + Clone,\n    P: PasswordHasher + Clone,\n    J: JwtService + Clone,\n{\n    pub fn new(pool: DbPool, auth_usecase: Arc\u003cAuthUseCase\u003cR, P, J\u003e\u003e, jwt_service: Arc\u003cJ\u003e) -\u003e Self {\n        Self {\n            pool,\n            auth_usecase,\n            jwt_service,\n        }\n    }\n}\n\n// Implementar AsRef para que health_handler pueda acceder al pool\nimpl\u003cR, P, J\u003e AsRef\u003cDbPool\u003e for AppState\u003cR, P, J\u003e\nwhere\n    R: UserRepository + Clone,\n    P: PasswordHasher + Clone,\n    J: JwtService + Clone,\n{\n    fn as_ref(\u0026self) -\u003e \u0026DbPool {\n        \u0026self.pool\n    }\n}\n\n// Implementar AsRef para que los handlers puedan acceder a AuthUseCase\nimpl\u003cR, P, J\u003e AsRef\u003cArc\u003cAuthUseCase\u003cR, P, J\u003e\u003e\u003e for AppState\u003cR, P, J\u003e\nwhere\n    R: UserRepository + Clone,\n    P: PasswordHasher + Clone,\n    J: JwtService + Clone,\n{\n    fn as_ref(\u0026self) -\u003e \u0026Arc\u003cAuthUseCase\u003cR, P, J\u003e\u003e {\n        \u0026self.auth_usecase\n    }\n}\n\n// Implementar AsRef para que los handlers puedan acceder a JwtService\nimpl\u003cR, P, J\u003e AsRef\u003cArc\u003cJ\u003e\u003e for AppState\u003cR, P, J\u003e\nwhere\n    R: UserRepository + Clone,\n    P: PasswordHasher + Clone,\n    J: JwtService + Clone,\n{\n    fn as_ref(\u0026self) -\u003e \u0026Arc\u003cJ\u003e {\n        \u0026self.jwt_service\n    }\n}\n\n/// Crea el router principal de la aplicación\n///\n/// Estructura:\n/// - /api/v1/health       - Health check (público)\n/// - /api/v1/auth/*       - Endpoints de autenticación (públicos)\n/// - /api/v1/users/*      - Endpoints de usuario (protegidos)\n/// - /api/v1/swagger-ui/  - Documentación Swagger UI\n///\n/// Middlewares aplicados:\n/// - CORS (restrictivo, desde settings)\n/// - Security headers\npub fn create_router\u003cR, P, J\u003e(\n    pool: DbPool,\n    auth_usecase: Arc\u003cAuthUseCase\u003cR, P, J\u003e\u003e,\n    jwt_service: Arc\u003cJ\u003e,\n    settings: \u0026Settings,\n) -\u003e Router\nwhere\n    R: UserRepository + Clone + 'static,\n    P: PasswordHasher + Clone + 'static,\n    J: JwtService + Clone + 'static,\n{\n    let app_state = AppState::new(pool, auth_usecase.clone(), jwt_service);\n\n    // Rutas públicas de autenticación\n    let auth_routes: Router\u003cAppState\u003cR, P, J\u003e\u003e = Router::new()\n        .route(\"/register\", post(register_handler::\u003cR, P, J, AppState\u003cR, P, J\u003e\u003e))\n        .route(\"/login\", post(login_handler::\u003cR, P, J, AppState\u003cR, P, J\u003e\u003e))\n        .route(\"/refresh\", post(refresh_handler::\u003cR, P, J, AppState\u003cR, P, J\u003e\u003e))\n        .route(\"/logout\", post(logout_handler));\n\n    // Rutas públicas (sin autenticación)\n    let public_routes: Router\u003cAppState\u003cR, P, J\u003e\u003e = Router::new()\n        .route(\"/health\", get(health_handler::\u003cAppState\u003cR, P, J\u003e\u003e))\n        .nest(\"/auth\", auth_routes);\n\n    // Rutas protegidas de usuarios (requieren autenticación)\n    let user_routes: Router\u003cAppState\u003cR, P, J\u003e\u003e = Router::new()\n        .route(\"/profile\", get(get_profile_handler::\u003cR, P, J, AppState\u003cR, P, J\u003e\u003e))\n        .route(\"/change-password\", post(change_password_handler::\u003cR, P, J, AppState\u003cR, P, J\u003e\u003e));\n\n    let protected_routes: Router\u003cAppState\u003cR, P, J\u003e\u003e = Router::new()\n        .nest(\"/users\", user_routes)\n        .layer(middleware::from_fn_with_state(\n            auth_usecase.clone(),\n            auth_middleware::\u003cR, P, J\u003e,\n        ));\n\n    match settings.environment {\n        Environment::Development =\u003e {\n            tracing::info!(\"🌍  Entorno: Desarrollo\");\n            tracing::info!(\"    • CSP: Permisivo para Swagger UI\");\n            tracing::info!(\"    • CORS: Permite localhost\");\n        }\n        Environment::Test =\u003e {\n            tracing::info!(\"🧪  Entorno: Testing\");\n            tracing::info!(\"    • CSP: Restrictivo\");\n            tracing::info!(\"    • CORS: Desde configuración\");\n        }\n        Environment::Production =\u003e {\n            tracing::info!(\"🔐  Entorno: Producción\");\n            tracing::info!(\"    • CSP: Máxima seguridad\");\n            tracing::info!(\"    • CORS: Muy restrictivo\");\n        }\n    }\n\n    // API v1\n    let api_v1 = Router::new()\n        .merge(public_routes)\n        .merge(protected_routes)\n        .with_state(app_state);\n\n    // Router principal con documentación Swagger\n    Router::new()\n        .merge(SwaggerUi::new(\"/api/v1/swagger-ui\").url(\"/api/v1/openapi.json\", ApiDoc::openapi()))\n        .nest(\"/api/v1\", api_v1)\n        // Middlewares globales\n        .layer(create_cors_layer(settings))\n        .layer(middleware::from_fn(security_headers_middleware))\n}\n\nstruct SecurityAddon;\n\nimpl Modify for SecurityAddon {\n    fn modify(\u0026self, openapi: \u0026mut utoipa::openapi::OpenApi) {\n        let components = openapi.components.as_mut().unwrap();\n        components.add_security_scheme(\n            \"bearer_auth\",\n            SecurityScheme::Http(\n                HttpBuilder::new()\n                    .scheme(HttpAuthScheme::Bearer)\n                    .bearer_format(\"JWT\")\n                    .description(Some(\"Ingrese su access token JWT\"))\n                    .build(),\n            ),\n        );\n    }\n}\n\n/// Documentación OpenAPI\n#[derive(OpenApi)]\n#[openapi(\n    paths(\n        crate::infrastructure::http::handlers::health_handler,\n        crate::infrastructure::http::handlers::register_handler,\n        crate::infrastructure::http::handlers::login_handler,\n        crate::infrastructure::http::handlers::refresh_handler,\n        crate::infrastructure::http::handlers::logout_handler,\n        crate::infrastructure::http::handlers::get_profile_handler,\n        crate::infrastructure::http::handlers::change_password_handler,\n    ),\n    components(\n        schemas(\n            crate::presentation::RegisterRequest,\n            crate::presentation::LoginRequest,\n            crate::presentation::RefreshRequest,\n            crate::presentation::ChangePasswordRequest,\n            crate::presentation::AuthResponse,\n            crate::presentation::UserResponse,\n            crate::presentation::SuccessResponse,\n            crate::presentation::HealthResponse,\n        )\n    ),\n    modifiers(\u0026SecurityAddon),\n    tags(\n        (name = \"Authentication\", description = \"Endpoints de autenticación de usuarios\"),\n        (name = \"Users\", description = \"Gestión de perfil de usuario\"),\n        (name = \"Health\", description = \"Health check del servicio\")\n    ),\n    info(\n        title = \"Auth API\",\n        version = \"1.0.0\",\n        description = \"API de autenticación enterprise en Rust con Axum, SQLx y JWT\",\n        contact(\n            name = \"API Support\",\n            email = \"anvorja@github.com\"\n        ),\n        license(\n            name = \"MIT\",\n        )\n    ),\n    servers(\n        (url = \"http://localhost:9090\", description = \"Servidor de desarrollo\"),\n    )\n)]\npub(crate) struct ApiDoc;","traces":[{"line":50,"address":[],"length":0,"stats":{"Line":0}},{"line":66,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":78,"address":[],"length":0,"stats":{"Line":0}},{"line":79,"address":[],"length":0,"stats":{"Line":0}},{"line":90,"address":[],"length":0,"stats":{"Line":0}},{"line":91,"address":[],"length":0,"stats":{"Line":0}},{"line":106,"address":[1362 nfo.title, \"Auth API\");\n    assert_eq!(openapi.info.version, \"1.0.0\");\n    assert!(!openapi.paths.paths.is_empty());\n}\n\n#[tokio::test]\n#[ignore] // Requiere configuración completa\nasync fn test_router_creation() {\n    let settings = Settings {\n        server: ServerSettings {\n            host: \"127.0.0.1\".to_string(),\n            port: 8080,\n        },\n        database: DatabaseSettings {\n            url: \"postgresql://postgres:superapostgres@localhost:5432/usuarios_rust_db_test\".to_string(),\n            max_connections: 5,\n            min_connections: 2,\n            acquire_timeout: 30,\n        },\n        jwt: JwtSettings {\n            secret: \"test-secret-key-minimum-32-characters-long\".to_string(),\n            access_token_expiry: 900,\n            refresh_token_expiry: 604800,\n        },\n        security: SecuritySettings {\n            allowed_origins: vec![\"http://localhost:3000\".to_string()],\n        },\n        environment: Environment::Test,\n    };\n\n    let pool = create_pool(\u0026settings).await.unwrap();\n\n    let user_repository = Arc::new(UserRepositorySqlx::new(pool.clone()));\n    let password_hasher = Arc::new(ArgonPasswordHasher::new_for_testing());\n    let jwt_service = Arc::new(JwtServiceImpl::new(\n        settings.jwt.secret.clone(),\n        settings.jwt.access_token_expiry,\n        settings.jwt.refresh_token_expiry,\n    ));\n\n    let auth_usecase = Arc::new(AuthUseCase::new(\n        user_repository,\n        password_hasher,\n        jwt_service.clone(),\n    ));\n\n    // Crear router - no debe panic\n    let _router = create_router(pool, auth_usecase, jwt_service, \u0026settings);\n}","traces":[],"covered":0,"coverable":0},{"path":["/","home","anborja","RustroverProjects","auth-api-rust","src","infrastructure","mod.rs"],"content":"// src/infrastructure/mod.rs\npub mod db;\npub mod http;\npub mod repositories;\npub mod security;\n\n#[cfg(test)]\nmod test;\n\npub use db::DbPool;\npub use repositories::*;\npub use security::*;","traces":[],"covered":0,"coverable":0},{"path":["/","home","anborja","RustroverProjects","auth-api-rust","src","infrastructure","repositories","mod.rs"],"content":"// src/infrastructure/repositories/mod.rs\npub mod user_repository_sqlx;\n\n#[cfg(test)]\nmod test;\n\npub use user_repository_sqlx::{\n    UserRepository,\n    UserRepositorySqlx\n};","traces":[],"covered":0,"coverable":0},{"path":["/","home","anborja","RustroverProjects","auth-api-rust","src","infrastructure","repositories","test","mod.rs"],"content":"// src/infrastructure/repositories/test/mod.rs\nmod user_repository_sqlx_test;","traces":[],"covered":0,"coverable":0},{"path":["/","home","anborja","RustroverProjects","auth-api-rust","src","infrastructure","repositories","test","user_repository_sqlx_test.rs"],"content":"// src/infrastructure/repositories/test/user_repository_sqlx_test.rs\nuse crate::infrastructure::repositories::{UserRepository, UserRepositorySqlx};\nuse crate::infrastructure::db::create_pool;\nuse crate::config::{Settings, DatabaseSettings, JwtSettings, ServerSettings, SecuritySettings, Environment};\nuse crate::domain::{User, Username, Email, PasswordHash};\nuse sqlx::PgPool;\n\n/// Crea un pool de base de datos para tests sin usar variables de entorno\nasync fn create_test_pool() -\u003e PgPool {\n    let settings = Settings {\n        server: ServerSettings {\n            host: \"127.0.0.1\".to_string(),\n            port: 8080,\n        },\n        database: DatabaseSettings {\n            url: \"postgresql://postgres:superapostgres@localhost:5432/usuarios_rust_db_test\".to_string(),\n            max_connections: 5,\n            min_connections: 2,\n            acquire_timeout: 30,\n        },\n        jwt: JwtSettings {\n            secret: \"test-secret-key-minimum-32-characters-long\".to_string(),\n            access_token_expiry: 900,\n            refresh_token_expiry: 604800,\n        },\n        security: SecuritySettings {\n            allowed_origins: vec![\"http://localhost:3000\".to_string()],\n        },\n        environment: Environment::Test,\n    };\n\n    create_pool(\u0026settings).await.expect(\"Failed to create test pool\")\n}\n\nasync fn create_test_user() -\u003e User {\n    User::new(\n        Username::new(\"testuser\".to_string()).unwrap(),\n        Email::new(\"test@example.com\".to_string()).unwrap(),\n        \"Test\".to_string(),\n        \"User\".to_string(),\n        PasswordHash::from_hash(\"$argon2id$v=19$m=19456,t=2,p=1$...\".to_string()),\n    )\n}\n\n#[tokio::test]\n#[ignore] // Requiere PostgreSQL corriendo\nasync fn test_create_user() {\n    let pool = create_test_pool().await;\n    let repo = UserRepositorySqlx::new(pool);\n    let user = create_test_user().await;\n\n    let result = repo.create(\u0026user).await;\n    assert!(result.is_ok());\n\n    // Cleanup\n    let _ = repo.delete(user.id()).await;\n}\n\n#[tokio::test]\n#[ignore]\nasync fn test_find_by_id() {\n    let pool = create_test_pool().await;\n    let repo = UserRepositorySqlx::new(pool);\n    let user = create_test_user().await;\n\n    repo.create(\u0026user).await.unwrap();\n\n    let found = repo.find_by_id(user.id()).await.unwrap();\n    assert!(found.is_some());\n    assert_eq!(found.unwrap().id(), user.id());\n\n    // Cleanup\n    let _ = repo.delete(user.id()).await;\n}\n\n#[tokio::test]\n#[ignore]\nasync fn test_find_by_username() {\n    let pool = create_test_pool().await;\n    let repo = UserRepositorySqlx::new(pool);\n    let user = create_test_user().await;\n\n    repo.create(\u0026user).await.unwrap();\n\n    let found = repo.find_by_username(user.username()).await.unwrap();\n    assert!(found.is_some());\n    assert_eq!(found.unwrap().username().value(), user.username().value());\n\n    // Cleanup\n    let _ = repo.delete(user.id()).await;\n}\n\n#[tokio::test]\n#[ignore]\nasync fn test_exists_by_username() {\n    let pool = create_test_pool().await;\n    let repo = UserRepositorySqlx::new(pool);\n    let user = create_test_user().await;\n\n    let exists_before = repo.exists_by_username(user.username()).await.unwrap();\n    assert!(!exists_before);\n\n    repo.create(\u0026user).await.unwrap();\n\n    let exists_after = repo.exists_by_username(user.username()).await.unwrap();\n    assert!(exists_after);\n\n    // Cleanup\n    let _ = repo.delete(user.id()).await;\n}\n\n#[tokio::test]\n#[ignore]\nasync fn test_duplicate_username() {\n    let pool = create_test_pool().await;\n    let repo = UserRepositorySqlx::new(pool);\n    let user1 = create_test_user().await;\n    let user2 = User::new(\n        Username::new(\"testuser\".to_string()).unwrap(),\n        Email::new(\"another@example.com\".to_string()).unwrap(),\n        \"Another\".to_string(),\n        \"User\".to_string(),\n        PasswordHash::from_hash(\"$argon2id$...\".to_string()),\n    );\n\n    repo.create(\u0026user1).await.unwrap();\n    let result = repo.create(\u0026user2).await;\n\n    assert!(result.is_err());\n\n    // Cleanup\n    let _ = repo.delete(user1.id()).await;\n}\n\n#[tokio::test]\n#[ignore]\nasync fn test_find_by_username_or_email_with_username() {\n    let pool = create_test_pool().await;\n    let repo = UserRepositorySqlx::new(pool);\n    let user = create_test_user().await;\n\n    repo.create(\u0026user).await.unwrap();\n\n    let found = repo.find_by_username_or_email(\"testuser\").await.unwrap();\n    assert!(found.is_some());\n    assert_eq!(found.unwrap().username().value(), \"testuser\");\n\n    // Cleanup\n    let _ = repo.delete(user.id()).await;\n}\n\n#[tokio::test]\n#[ignore]\nasync fn test_find_by_username_or_email_with_email() {\n    let pool = create_test_pool().await;\n    let repo = UserRepositorySqlx::new(pool);\n    let user = create_test_user().await;\n\n    repo.create(\u0026user).await.unwrap();\n\n    let found = repo.find_by_username_or_email(\"test@example.com\").await.unwrap();\n    assert!(found.is_some());\n    assert_eq!(found.unwrap().email().value(), \"test@example.com\");\n\n    // Cleanup\n    let _ = repo.delete(user.id()).await;\n}\n\n#[tokio::test]\n#[ignore]\nasync fn test_update_user() {\n    let pool = create_test_pool().await;\n    let repo = UserRepositorySqlx::new(pool);\n    let mut user = create_test_user().await;\n\n    repo.create(\u0026user).await.unwrap();\n\n    // Actualizar el usuario\n    user.update_profile(\"Updated\".to_string(), \"Name\".to_string());\n    let result = repo.update(\u0026user).await;\n\n    assert!(result.is_ok());\n\n    // Verificar que se actualizó\n    let found = repo.find_by_id(user.id()).await.unwrap().unwrap();\n    assert_eq!(found.first_name(), \"Updated\");\n    assert_eq!(found.last_name(), \"Name\");\n\n    // Cleanup\n    let _ = repo.delete(user.id()).await;\n}\n\n#[tokio::test]\n#[ignore]\nasync fn test_delete_user() {\n    let pool = create_test_pool().await;\n    let repo = UserRepositorySqlx::new(pool);\n    let user = create_test_user().await;\n\n    repo.create(\u0026user).await.unwrap();\n\n    let result = repo.delete(user.id()).await;\n    assert!(result.is_ok());\n\n    // Verificar que se eliminó\n    let found = repo.find_by_id(user.id()).await.unwrap();\n    assert!(found.is_none());\n}\n#[tokio::test]\n#[ignore]\nasync fn test_find_by_email() {\n    let pool = create_test_pool().await;\n    let repo = UserRepositorySqlx::new(pool);\n    let user = create_test_user().await;\n\n    repo.create(\u0026user).await.unwrap();\n\n    let found = repo.find_by_email(user.email()).await.unwrap();\n    assert!(found.is_some());\n    assert_eq!(found.unwrap().email().value(), user.email().value());\n\n    // Cleanup\n    let _ = repo.delete(user.id()).await;\n}\n\n#[tokio::test]\n#[ignore]\nasync fn test_find_by_email_not_found() {\n    let pool = create_test_pool().await;\n    let repo = UserRepositorySqlx::new(pool);\n\n    let non_existent_email = Email::new(\"nonexistent@example.com\".to_string()).unwrap();\n    let found = repo.find_by_email(\u0026non_existent_email).await.unwrap();\n\n    assert!(found.is_none());\n}\n","traces":[{"line":9,"address":[13615696,13615699],"length":1,"stats":{"Line":0}},{"line":11,"address":[14283979],"length":1,"stats":{"Line":0}},{"line":15,"address":[14284071],"length":1,"stats":{"Line":0}},{"line":21,"address":[14284208],"length":1,"stats":{"Line":0}},{"line":26,"address":[14284592],"length":1,"stats":{"Line":0}},{"line":32,"address":[13308519],"length":1,"stats":{"Line":0}},{"line":35,"address":[13615712],"length":1,"stats":{"Line":0}},{"line":37,"address":[14285297,14285439],"length":1,"stats":{"Line":0}},{"line":38,"address":[14285574,14285478],"length":1,"stats":{"Line":0}},{"line":39,"address":[14285696,14285616],"length":1,"stats":{"Line":0}},{"line":40,"address":[14285704,14285781],"length":1,"stats":{"Line":0}},{"line":41,"address":[14285789,14285874],"length":1,"stats":{"Line":0}}],"covered":0,"coverable":12},{"path":["/","home","anborja","RustroverProjects","auth-api-rust","src","infrastructure","repositories","user_repository_sqlx.rs"],"content":"// src/infrastructure/repositories/user_repository_sqlx.rs\nuse chrono::{DateTime, Utc};\nuse sqlx::PgPool;\nuse uuid::Uuid;\n\nuse crate::domain::{Email, PasswordHash, User, UserId, Username};\nuse crate::error::{AppError, AppResult};\n\n/// Trait para abstraer el repositorio de usuarios\n/// Permite testing con mocks y cambio de implementación\n#[async_trait::async_trait]\npub trait UserRepository: Send + Sync {\n    /// Crea un nuevo usuario en la base de datos\n    async fn create(\u0026self, user: \u0026User) -\u003e AppResult\u003c()\u003e;\n\n    /// Busca un usuario por ID\n    async fn find_by_id(\u0026self, id: UserId) -\u003e AppResult\u003cOption\u003cUser\u003e\u003e;\n\n    /// Busca un usuario por username\n    async fn find_by_username(\u0026self, username: \u0026Username) -\u003e AppResult\u003cOption\u003cUser\u003e\u003e;\n\n    /// Busca un usuario por email\n    async fn find_by_email(\u0026self, email: \u0026Email) -\u003e AppResult\u003cOption\u003cUser\u003e\u003e;\n\n    /// Busca un usuario por username o email (útil para login)\n    async fn find_by_username_or_email(\u0026self, identifier: \u0026str) -\u003e AppResult\u003cOption\u003cUser\u003e\u003e;\n\n    /// Actualiza un usuario existente\n    async fn update(\u0026self, user: \u0026User) -\u003e AppResult\u003c()\u003e;\n\n    /// Elimina un usuario por ID\n    async fn delete(\u0026self, id: UserId) -\u003e AppResult\u003c()\u003e;\n\n    /// Verifica si existe un usuario con el username dado\n    async fn exists_by_username(\u0026self, username: \u0026Username) -\u003e AppResult\u003cbool\u003e;\n\n    /// Verifica si existe un usuario con el email dado\n    async fn exists_by_email(\u0026self, email: \u0026Email) -\u003e AppResult\u003cbool\u003e;\n\n}\n\n/// Implementación del repositorio usando SQLx y PostgreSQL\n#[derive(Clone)]\npub struct UserRepositorySqlx {\n    pool: PgPool,\n}\n\nimpl UserRepositorySqlx {\n    pub fn new(pool: PgPool) -\u003e Self {\n        Self { pool }\n    }\n\n    /// Convierte una fila de la base de datos a una entidad User\n    fn row_to_user(\n        id: Uuid,\n        username: String,\n        email: String,\n        first_name: String,\n        last_name: String,\n        password_hash: String,\n        created_at: DateTime\u003cUtc\u003e,\n        updated_at: DateTime\u003cUtc\u003e,\n    ) -\u003e AppResult\u003cUser\u003e {\n        let user_id = UserId::from_uuid(id);\n        let username = Username::new(username)\n            .map_err(|e| AppError::DatabaseError(format!(\"Invalid username from DB: {}\", e)))?;\n        let email = Email::new(email)\n            .map_err(|e| AppError::DatabaseError(format!(\"Invalid email from DB: {}\", e)))?;\n        let password_hash = PasswordHash::from_hash(password_hash);\n\n        Ok(User::from_repository(\n            user_id,\n            username,\n            email,\n            first_name,\n            last_name,\n            password_hash,\n            created_at,\n            updated_at,\n        ))\n    }\n}\n\n#[async_trait::async_trait]\nimpl UserRepository for UserRepositorySqlx {\n    async fn create(\u0026self, user: \u0026User) -\u003e AppResult\u003c()\u003e {\n        sqlx::query!(\n            r#\"\n            INSERT INTO users (id, username, email, first_name, last_name, password_hash, created_at, updated_at)\n            VALUES ($1, $2, $3, $4, $5, $6, $7, $8)\n            \"#,\n            user.id().value(),\n            user.username().value(),\n            user.email().value(),\n            user.first_name(),\n            user.last_name(),\n            user.password_hash().value(),\n            user.created_at(),\n            user.updated_at(),\n        )\n            .execute(\u0026self.pool)\n            .await?;\n\n        tracing::debug!(\"Usuario creado: {}\", user.username().value());\n        Ok(())\n    }\n\n    async fn find_by_id(\u0026self, id: UserId) -\u003e AppResult\u003cOption\u003cUser\u003e\u003e {\n        let result = sqlx::query!(\n            r#\"\n            SELECT id, username, email, first_name, last_name, password_hash, created_at, updated_at\n            FROM users\n            WHERE id = $1\n            \"#,\n            id.value()\n        )\n            .fetch_optional(\u0026self.pool)\n            .await?;\n\n        match result {\n            Some(row) =\u003e {\n                let user = Self::row_to_user(\n                    row.id,\n                    row.username,\n                    row.email,\n                    row.first_name,\n                    row.last_name,\n                    row.password_hash,\n                    row.created_at,\n                    row.updated_at,\n                )?;\n                Ok(Some(user))\n            }\n            None =\u003e Ok(None),\n        }\n    }\n\n    async fn find_by_username(\u0026self, username: \u0026Username) -\u003e AppResult\u003cOption\u003cUser\u003e\u003e {\n        let result = sqlx::query!(\n            r#\"\n            SELECT id, username, email, first_name, last_name, password_hash, created_at, updated_at\n            FROM users\n            WHERE username = $1\n            \"#,\n            username.value()\n        )\n            .fetch_optional(\u0026self.pool)\n            .await?;\n\n        match result {\n            Some(row) =\u003e {\n                let user = Self::row_to_user(\n                    row.id,\n                    row.username,\n                    row.email,\n                    row.first_name,\n                    row.last_name,\n                    row.password_hash,\n                    row.created_at,\n                    row.updated_at,\n                )?;\n                Ok(Some(user))\n            }\n            None =\u003e Ok(None),\n        }\n    }\n\n    async fn find_by_email(\u0026self, email: \u0026Email) -\u003e AppResult\u003cOption\u003cUser\u003e\u003e {\n        let result = sqlx::query!(\n            r#\"\n            SELECT id, username, email, first_name, last_name, password_hash, created_at, updated_at\n            FROM users\n            WHERE email = $1\n            \"#,\n            email.value()\n        )\n            .fetch_optional(\u0026self.pool)\n            .await?;\n\n        match result {\n            Some(row) =\u003e {\n                let user = Self::row_to_user(\n                    row.id,\n                    row.username,\n                    row.email,\n                    row.first_name,\n                    row.last_name,\n                    row.password_hash,\n                    row.created_at,\n                    row.updated_at,\n                )?;\n                Ok(Some(user))\n            }\n            None =\u003e Ok(None),\n        }\n    }\n\n    async fn find_by_username_or_email(\u0026self, identifier: \u0026str) -\u003e AppResult\u003cOption\u003cUser\u003e\u003e {\n        let result = sqlx::query!(\n            r#\"\n            SELECT id, username, email, first_name, last_name, password_hash, created_at, updated_at\n            FROM users\n            WHERE username = $1 OR email = $1\n            \"#,\n            identifier\n        )\n            .fetch_optional(\u0026self.pool)\n            .await?;\n\n        match result {\n            Some(row) =\u003e {\n                let user = Self::row_to_user(\n                    row.id,\n                    row.username,\n                    row.email,\n                    row.first_name,\n                    row.last_name,\n                    row.password_hash,\n                    row.created_at,\n                    row.updated_at,\n                )?;\n                Ok(Some(user))\n            }\n            None =\u003e Ok(None),\n        }\n    }\n\n    async fn update(\u0026self, user: \u0026User) -\u003e AppResult\u003c()\u003e {\n        let result = sqlx::query!(\n            r#\"\n            UPDATE users\n            SET first_name = $2,\n                last_name = $3,\n                password_hash = $4,\n                updated_at = $5\n            WHERE id = $1\n            \"#,\n            user.id().value(),\n            user.first_name(),\n            user.last_name(),\n            user.password_hash().value(),\n            user.updated_at(),\n        )\n            .execute(\u0026self.pool)\n            .await?;\n\n        if result.rows_affected() == 0 {\n            return Err(AppError::UserNotFound);\n        }\n\n        tracing::debug!(\"Usuario actualizado: {}\", user.id().to_string());\n        Ok(())\n    }\n\n    async fn delete(\u0026self, id: UserId) -\u003e AppResult\u003c()\u003e {\n        let result = sqlx::query!(\n            r#\"\n            DELETE FROM users\n            WHERE id = $1\n            \"#,\n            id.value()\n        )\n            .execute(\u0026self.pool)\n            .await?;\n\n        if result.rows_affected() == 0 {\n            return Err(AppError::UserNotFound);\n        }\n\n        tracing::debug!(\"Usuario eliminado: {}\", id.to_string());\n        Ok(())\n    }\n\n    async fn exists_by_username(\u0026self, username: \u0026Username) -\u003e AppResult\u003cbool\u003e {\n        let result = sqlx::query!(\n            r#\"\n            SELECT EXISTS(SELECT 1 FROM users WHERE username = $1) as \"exists!\"\n            \"#,\n            username.value()\n        )\n            .fetch_one(\u0026self.pool)\n            .await?;\n\n        Ok(result.exists)\n    }\n\n    async fn exists_by_email(\u0026self, email: \u0026Email) -\u003e AppResult\u003cbool\u003e {\n        let result = sqlx::query!(\n            r#\"\n            SELECT EXISTS(SELECT 1 FROM users WHERE email = $1) as \"exists!\"\n            \"#,\n            email.value()\n        )\n            .fetch_one(\u0026self.pool)\n            .await?;\n\n        Ok(result.exists)\n    }\n}","traces":[{"line":49,"address":[14158000],"length":1,"stats":{"Line":0}},{"line":54,"address":[14157613,14157966,14156320],"length":1,"stats":{"Line":0}},{"line":64,"address":[14156396],"length":1,"stats":{"Line":0}},{"line":65,"address":[14156662,14156734,14156569,14157678],"length":1,"stats":{"Line":0}},{"line":66,"address":[14156702,14156639],"length":1,"stats":{"Line":0}},{"line":67,"address":[14156967,14157039,14156833],"length":1,"stats":{"Line":0}},{"line":68,"address":[14156944,14157007],"length":1,"stats":{"Line":0}},{"line":69,"address":[14157141],"length":1,"stats":{"Line":0}},{"line":71,"address":[14157395],"length":1,"stats":{"Line":0}},{"line":73,"address":[14157256],"length":1,"stats":{"Line":0}},{"line":74,"address":[14157293],"length":1,"stats":{"Line":0}},{"line":75,"address":[14157333],"length":1,"stats":{"Line":0}},{"line":76,"address":[14157364],"length":1,"stats":{"Line":0}},{"line":86,"address":[14932618,14930095,14930370,14930189,14930435,14933513,14930048,14930505],"length":1,"stats":{"Line":0}},{"line":87,"address":[14932442,14932596,14932875,1493298 rive(Clone)]\npub struct JwtServiceImpl {\n    encoding_key: EncodingKey,\n    decoding_key: DecodingKey,\n    access_token_expiry: i64,\n    refresh_token_expiry: i64,\n}\n\nimpl JwtServiceImpl {\n    /// Crea un nuevo servicio JWT\n    ///\n    /// # Parámetros\n    /// - `secret`: Secret para firmar tokens (mínimo 32 caracteres recomendado)\n    /// - `access_token_expiry`: Tiempo de vida del access token en segundos\n    /// - `refresh_token_expiry`: Tiempo de vida del refresh token en segundos\n    pub fn new(secret: String, access_token_expiry: i64, refresh_token_expiry: i64) -\u003e Self {\n        let encoding_key = EncodingKey::from_secret(secret.as_bytes());\n        let decoding_key = DecodingKey::from_secret(secret.as_bytes());\n\n        Self {\n            encoding_key,\n            decoding_key,\n            access_token_expiry,\n            refresh_token_expiry,\n        }\n    }\n\n    /// Genera un token JWT genérico\n    fn generate_token\u003cT: Serialize\u003e(\u0026self, claims: \u0026T) -\u003e Result\u003cString, AppError\u003e {\n        encode(\u0026Header::default(), claims, \u0026self.encoding_key)\n            .map_err(|_| AppError::JwtGenerationError)\n    }\n\n    /// Valida y decodifica un token JWT genérico\n    fn decode_token\u003cT: for\u003c'de\u003e Deserialize\u003c'de\u003e\u003e(\u0026self, token: \u0026str) -\u003e Result\u003cT, AppError\u003e {\n        let mut validation = Validation::default();\n        validation.validate_exp = true;\n        validation.leeway = 0; // Sin margen de error en expiración\n\n        let token_data = decode::\u003cT\u003e(token, \u0026self.decoding_key, \u0026validation)?;\n\n        Ok(token_data.claims)\n    }\n}\n\n#[async_trait::async_trait]\nimpl JwtService for JwtServiceImpl {\n    fn generate_access_token(\u0026self, user_id: UserId, username: String) -\u003e Result\u003cString, AppError\u003e {\n        let claims = AccessTokenClaims::new(user_id, username, self.access_token_expiry);\n        self.generate_token(\u0026claims)\n    }\n\n    fn generate_refresh_token(\u0026self, user_id: UserId) -\u003e Result\u003cString, AppError\u003e {\n        let claims = RefreshTokenClaims::new(user_id, self.refresh_token_expiry);\n        self.generate_token(\u0026claims)\n    }\n\n    fn validate_access_token(\u0026self, token: \u0026str) -\u003e Result\u003cAccessTokenClaims, AppError\u003e {\n        self.decode_token(token)\n    }\n\n    fn validate_refresh_token(\u0026self, token: \u0026str) -\u003e Result\u003cRefreshTokenClaims, AppError\u003e {\n        let claims: RefreshTokenClaims = self.decode_token(token)?;\n\n        // Validación adicional: verificar que es un refresh token\n        if claims.token_type != \"refresh\" {\n            return Err(AppError::InvalidRefreshToken);\n        }\n\n        Ok(claims)\n    }\n\n    fn get_access_token_expiry(\u0026self) -\u003e i64 {\n        self.access_token_expiry\n    }\n\n    fn get_refresh_token_expiry(\u0026self) -\u003e i64 {\n        self.refresh_token_expiry\n    }\n}","traces":[{"line":48,"address":[14878368,14878764],"length":1,"stats":{"Line":1}},{"line":49,"address":[14878492,14878424],"length":1,"stats":{"Line":2}},{"line":50,"address":[14878513,14878578],"length":1,"stats":{"Line":3}},{"line":61,"address":[],"length":0,"stats":{"Line":3}},{"line":62,"address":[],"length":0,"stats":{"Line":2}},{"line":63,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":2}},{"line":68,"address":[],"length":0,"stats":{"Line":2}},{"line":69,"address":[],"length":0,"stats":{"Line":3}},{"line":70,"address":[15001703,15002247],"length":1,"stats":{"Line":2}},{"line":72,"address":[],"length":0,"stats":{"Line":4}},{"line":74,"address":[],"length":0,"stats":{"Line":2}},{"line":80,"address":[14877408,14877557],"length":1,"stats":{"Line":2}},{"line":81,"address":[14877446],"length":1,"stats":{"Line":1}},{"line":82,"address":[14877493],"length":1,"stats":{"Line":1}},{"li c fn hash_password(\u0026self, password: \u0026str) -\u003e Result\u003cDomainPasswordHash, AppError\u003e;\n\n    /// Verifica un password plano contra un hash\n    async fn verify_password(\u0026self, password: \u0026str, hash: \u0026DomainPasswordHash) -\u003e Result\u003cbool, AppError\u003e;\n}\n\n/// Implementación de PasswordHasher usando Argon2id\n///\n/// Argon2id es el algoritmo ganador de la Password Hashing Competition (PHC)\n/// y es resistente a ataques de GPU, ASIC y side-channel.\n///\n/// Configuración enterprise-grade:\n/// - Algorithm: Argon2id (híbrido, resistente a todos los ataques)\n/// - Memory cost: 19 MiB (19456 KiB)\n/// - Time cost: 2 iterations\n/// - Parallelism: 1 thread\n/// - Output length: 32 bytes\n#[derive(Clone)]\npub struct ArgonPasswordHasher {\n    argon2: Argon2\u003c'static\u003e,\n}\n\nimpl ArgonPasswordHasher {\n    /// Crea un nuevo hasher con configuración por defecto (segura)\n    pub fn new() -\u003e Self {\n        Self::with_params(\n            19456, // 19 MiB - balance entre seguridad y performance\n            2,     // 2 iterations\n            1,     // 1 thread (suficiente para passwords)\n        )\n    }\n\n    /// Crea un hasher con parámetros personalizados\n    ///\n    /// # Parámetros\n    /// - `memory_cost_kib`: Memoria en KiB (mínimo 8, recomendado 19456)\n    /// - `time_cost`: Número de iteraciones (mínimo 1, recomendado 2-4)\n    /// - `parallelism`: Número de threads paralelos (típicamente 1)\n    pub fn with_params(memory_cost_kib: u32, time_cost: u32, parallelism: u32) -\u003e Self {\n        let params = Params::new(memory_cost_kib, time_cost, parallelism, None)\n            .expect(\"Invalid Argon2 parameters\");\n\n        let argon2 = Argon2::new(\n            Algorithm::Argon2id,\n            Version::V0x13,\n            params,\n        );\n\n        Self { argon2 }\n    }\n\n    /// Configuración para testing (más rápida, menos segura)\n    /// NUNCA usar en producción\n    #[cfg(test)]\n    pub fn new_for_testing() -\u003e Self {\n        Self::with_params(\n            8,    // 8 KiB - mínimo\n            1,    // 1 iteration - mínimo\n            1,    // 1 thread\n        )\n    }\n}\n\nimpl Default for ArgonPasswordHasher {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[async_trait::async_trait]\nimpl PasswordHasher for ArgonPasswordHasher {\n    async fn hash_password(\u0026self, password: \u0026str) -\u003e Result\u003cDomainPasswordHash, AppError\u003e {\n        // Validación básica del password\n        if password.is_empty() {\n            return Err(AppError::ValidationError(\"Password vacío\".to_string()));\n        }\n\n        if password.len() \u003e 128 {\n            return Err(AppError::ValidationError(\n                \"Password demasiado largo (máximo 128 caracteres)\".to_string(),\n            ));\n        }\n\n        // El hashing es CPU-intensivo, ejecutarlo en un thread bloqueante\n        let password_owned = password.to_string();\n        let argon2 = self.argon2.clone();\n\n        let hash = tokio::task::spawn_blocking(move || {\n            // Generar salt criptográficamente seguro\n            let salt = SaltString::generate(\u0026mut OsRng);\n\n            // Hashear el password\n            argon2\n                .hash_password(password_owned.as_bytes(), \u0026salt)\n                .map(|hash| hash.to_string())\n        })\n            .await\n            .map_err(|_| AppError::PasswordHashError)?\n            .map_err(|_| AppError::PasswordHashError)?;\n\n        Ok(DomainPasswordHash::from_hash(hash))\n    }\n\n    async fn verify_password(\u0026self, password: \u0026str, hash: \u0026DomainPasswordHash) -\u003e Result\u003cbool, AppError\u003e {\n        // Validación básica\n        if password.is_empty() {\n            return Ok(false);\n        }\n\n        let password_owned = password.to_string();\n        let hash_owned = hash.value().to_string();\n        let argon2 = self.argon2.clone();\n\n        // La verificación es CPU-intensiva, ejecutarla en un thread bloqueante\n        let result = tokio::task::spawn_blocking(move || {\n            // Parsear el hash almacenado\n            let parsed_hash = PasswordHash::new(\u0026hash_owned)?;\n\n            // Verificar el password\n            argon2.verify_password(password_owned.as_bytes(), \u0026parsed_hash)\n        })\n            .await\n            .map_err(|_| AppError::PasswordHashError)?;\n\n        match result {\n            Ok(_) =\u003e Ok(true),\n            Err(_) =\u003e Ok(false),\n        }\n    }\n}","traces":[{"line":39,"address":[15350608],"length":1,"stats":{"Line":0}},{"line":53,"address":[15350416],"length":1,"stats":{"Line":1}},{"line":54,"address":[15350454],"length":1,"stats":{"Line":1}},{"line":69,"address":[15350576],"length":1,"stats":{"Line":1}},{"line":79,"address":[15350384],"length":1,"stats":{"Line":0}},{"line":80,"address":[15350392],"length":1,"stats":{"Line":0}},{"line":86,"address":[14618672,14619063,14619879,14620734,14618795,14618999,14618707,14620707,14618949],"length":1,"stats":{"Line":11}},{"line":88,"address":[14618966,14619106],"length":1,"stats":{"Line":3}},{"line":89,"address":[14619136,14619750],"length":1,"stats":{"Line":2}},{"line":92,"address":[14619117,14619175],"length":1,"stats":{"Line":3}},{"line":93,"address":[14619621],"length":1,"stats":{"Line":1}},{"line":94,"address":[14619214],"length":1,"stats":{"Line":1}},{"line":99,"address":[14619188,14619294],"length":1,"stats":{"Line":4}},{"line":100,"address":[14619306],"length":1,"stats":{"Line":3}},{"line":102,"address":[14621019,14620037,14619357,14619594,14620357,14620764,14620119,14620740,14620186,14620290,14620848],"length":1,"stats":{"Line":7}},{"line":104,"address":[14620880],"length":1,"stats":{"Line":1}},{"line":108,"address":[14620926],"length":1,"stats":{"Line":1}},{"line":109,"address":[14620989,14621068,14621056],"length":1,"stats":{"Line":6}},{"line":111,"address":[14619603,1461
