[package]
name = "auth-api-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.9", features = ["macros", "http2", "multipart"] }
tokio = { version = "1.43.0", features = ["full"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
validator = { version = "0.19.0", features = ["derive"] }
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs", "set-header"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
jsonwebtoken = "9.3.0"
argon2 = "0.5.3"
utoipa = { version = "5.3.1", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "8.1.0", features = ["axum"] }
dotenvy = "0.15.7"
thiserror = "2.0.11"
uuid = { version = "1.11.1", features = ["serde", "v4"] }
chrono = { version = "0.4.39", features = ["serde"] }
rand = "0.9.0"
anyhow = "1.0.95"
async-trait = "0.1.83"
axum-extra = { version = "0.9", features = ["cookie"] }
tower = "0.5.2"

